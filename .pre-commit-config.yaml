# Install once with: pip install -r requirements-dev.txt && pre-commit install
# Update the revisions periodically with: pre-commit autoupdate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Only numpy/scipy as an extra dependency: PySide6/pyvista/vtk/
        # pymeshlab are heavy binaries that would slow down every commit
        # without adding precision (with ignore_missing_imports they're
        # already treated as Any). The check with the full dependencies
        # installed is the "Type checking (mypy)" step of CI
        # (.github/workflows/ci.yml).
        additional_dependencies: [numpy, scipy]
        args: [--ignore-missing-imports]
        files: ^(remesh_core|app|logging_config)\.py$|^(ui|tests)/

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
