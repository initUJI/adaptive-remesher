# Instalar una vez con: pip install -r requirements-dev.txt && pre-commit install
# Actualizar las revisiones periodicamente con: pre-commit autoupdate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Solo numpy/scipy como dependencia extra: PySide6/pyvista/vtk/
        # pymeshlab son binarios pesados que ralentizarian cada commit sin
        # anadir precision (con ignore_missing_imports ya se tratan como
        # Any). El chequeo con las dependencias completas instaladas es el
        # paso "Tipos (mypy)" de CI (.github/workflows/ci.yml).
        additional_dependencies: [numpy, scipy]
        args: [--ignore-missing-imports]
        files: ^(remesh_core|app)\.py$|^(ui|tests)/

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
