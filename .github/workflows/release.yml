name: Release

# Triggered by pushing a "vX.Y.Z" tag (see BUILD.md): builds the
# desktop executable with PyInstaller on Windows, macOS and Linux,
# checks that each one starts up (smoke test) and attaches each one as
# an asset of a GitHub Release for that tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: adaptive-remesher-windows
          - os: macos-latest
            asset_name: adaptive-remesher-macos
          - os: ubuntu-latest
            asset_name: adaptive-remesher-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build (PyInstaller)
        run: pyinstaller adaptive-remesher.spec

      - name: Smoke test (starts without errors on all three platforms)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          exe_name = "adaptive-remesher.exe" if sys.platform == "win32" else "adaptive-remesher"
          exe = os.path.join("dist", "adaptive-remesher", exe_name)

          proc = subprocess.Popen(
              [exe], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True
          )
          time.sleep(8)
          if proc.poll() is not None:
              print(proc.stdout.read())
              print(
                  f"The executable exited on its own (code {proc.returncode}) "
                  "within 8s: likely a startup failure (broken import, "
                  "unpackaged native dependency, etc.)."
              )
              sys.exit(1)

          proc.terminate()
          try:
              proc.wait(timeout=5)
          except subprocess.TimeoutExpired:
              proc.kill()
              proc.wait()
          print("The executable started and stayed alive for 8s with no apparent errors.")
          PY

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/adaptive-remesher/* -DestinationPath "${{ matrix.asset_name }}.zip"
          echo "ARCHIVE=${{ matrix.asset_name }}.zip" >> $env:GITHUB_ENV

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "${{ matrix.asset_name }}.tar.gz" -C dist adaptive-remesher
          echo "ARCHIVE=${{ matrix.asset_name }}.tar.gz" >> "$GITHUB_ENV"

      - name: Attach to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
