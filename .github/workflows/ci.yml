name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The tests in tests/test_ui_integration.py instantiate the real Qt
      # window (with pytest-qt); "offscreen" avoids needing a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # System libraries that Qt6's "offscreen" plugin needs to load on
      # an Ubuntu runner without a graphical environment.
      - name: System dependencies for Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type checking (mypy)
        run: mypy remesh_core.py app.py logging_config.py ui tests

      - name: Tests (pytest)
        run: pytest
