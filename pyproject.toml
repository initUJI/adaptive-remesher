[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Docstrings and tooltips often exceed the line limit; it's not worth
# forcing the wrap just for style.
ignore = ["E501"]

[tool.mypy]
# `python_version` deliberately left unset: let mypy infer the target
# from the interpreter running it. Pinning it here (e.g. to 3.11) breaks
# as soon as a dependency with no version cap (see requirements.txt)
# publishes stubs that already assume newer syntax (PEP 695 type
# statements, etc.).
ignore_missing_imports = true
